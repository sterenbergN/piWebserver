# Build a Raspberry Pi release on every push to master (or on demand) and
# publish it as a GitHub release. The Pi installs it with scripts/deploy.sh.
name: Release for Raspberry Pi

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write      # create the release
  id-token: write      # sign the build attestation
  attestations: write

jobs:
  release:
    # Native 64-bit ARM, same as the Pi, so sharp's prebuilt binary matches.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npx eslint . --quiet

      - name: Build
        run: npm run build
        env:
          NEXT_OUTPUT: standalone
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Package
        run: RELEASE_ID="build-$(date -u +%Y%m%d)-${GITHUB_SHA::7}" node scripts/package-release.mjs --tar

      - name: Smoke test the packaged build
        # Remove the build folders first so nothing can quietly depend on
        # paths that only exist on this machine (the Pi won't have them).
        run: |
          rm -rf .next-build release
          mkdir -p /tmp/smoke && tar -xzf dist/*.tar.gz -C /tmp/smoke
          if find /tmp/smoke -type l -lname '/*' | grep .; then echo "absolute symlinks in release"; exit 1; fi
          if find /tmp/smoke -xtype l | grep .; then echo "broken symlinks in release"; exit 1; fi
          cd /tmp/smoke && PORT=3999 node server.js > /tmp/smoke.log 2>&1 &
          up=
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:3999/api/health && up=1 && break; sleep 1; done
          # /api/media loads sharp (native): a thumbnail proves photos and PDFs will serve.
          [ -n "$up" ] && curl -fsS -o /dev/null -w 'thumbnail %{http_code} %{content_type}\n' 'http://127.0.0.1:3999/api/media/icons/icon-192.png?w=128' && exit 0
          cat /tmp/smoke.log; exit 1

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed through the environment, never pasted into the script.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          tag="$(cat dist/release-id)"
          printf 'Automatic build of %s\n\n%s\n' "${GITHUB_SHA::7}" "${COMMIT_MESSAGE:-manual run}" > notes.md
          gh release create "$tag" dist/*.tar.gz dist/*.tar.gz.sha256 \
            --target "$GITHUB_SHA" --title "$tag" --latest --notes-file notes.md

      - name: Keep the 10 newest builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName,createdAt -q 'sort_by(.createdAt) | reverse | .[10:] | .[].tagName' \
            | grep '^build-' | xargs -r -n1 gh release delete --cleanup-tag --yes
